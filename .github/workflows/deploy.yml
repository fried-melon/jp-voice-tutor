name: Deploy static tutor to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/restore-avatar.mjs
      - run: node scripts/verify-assets.mjs
      - run: npm test
      - run: npm run build
        env:
          VITE_FACE_MODE: human3d
          VITE_AVATAR_PREVIEW: "true"
          VITE_INITIAL_2D_FACE: "true"
          VITE_OWNER_TOKEN_SERVICE_ENABLED: "true"
          VITE_OWNER_TOKEN_ENDPOINT: https://jp-tutor-owner-token.leejeongjin7178.workers.dev/api/live-token
          VITE_GOOGLE_CLIENT_ID: 410292686280-79kcfl4b1bcvb9okkl2ptjmh77qksm5v.apps.googleusercontent.com
          VITE_NOTES_PERSIST: "true"
          VITE_NEXT_LESSON_SUGGESTION: "true"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
